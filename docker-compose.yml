services:
  nginx:
    build:
      context: .           # kontekst to katalog główny projektu
      dockerfile: nginx/Dockerfile
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/certs:/etc/nginx/certs:ro
    depends_on:
      - api
      - auth-service

  api:
    build: ./backend
    # bez ports – dostępny tylko przez nginx
    ports:
      - "8000:8000"   # tymczasowo do debugowania
    depends_on:
      db:
        condition: service_healthy
    environment:
      - DATABASE_URL=mysql+pymysql://${MYSQL_USER}:${MYSQL_PASSWORD}@db:3306/appdb
      - SECRET_KEY=${SECRET_KEY}
      - ALGORITHM=${ALGORITHM}
      - INTERNAL_SERVICE_TOKEN=${INTERNAL_SERVICE_TOKEN}

  auth-service:
    build: ./auth-service
    # bez ports – dostępny tylko przez nginx
    depends_on:
      db:
        condition: service_healthy
    environment:
      - DATABASE_URL=mysql+pymysql://${MYSQL_USER}:${MYSQL_PASSWORD}@db:3306/authdb
      - SECRET_KEY=${SECRET_KEY}
      - ALGORITHM=${ALGORITHM}
      - ACCESS_TOKEN_EXPIRE_MINUTES=${ACCESS_TOKEN_EXPIRE_MINUTES}
      - INTERNAL_SERVICE_TOKEN=${INTERNAL_SERVICE_TOKEN}

  sms-service:
    build: ./sms-service
    # bez ports – nie jest publicznie dostępny
    ports:
    - "8002:8002"   # tymczasowo do debugowania
    depends_on:
      - auth-service
      - api
    environment:
      - SMS_PROVIDER=${SMS_PROVIDER}
      - AUTH_SERVICE_URL=http://auth-service:8001
      - BACKEND_URL=http://api:8000
      - INTERNAL_SERVICE_TOKEN=${INTERNAL_SERVICE_TOKEN}
      - SMS_CHECK_INTERVAL_HOURS=${SMS_CHECK_INTERVAL_HOURS}

  db:
    image: mysql:8
    ports:
      - "3306:3306"        # zostaw dla debugowania
    environment:
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD}
      - MYSQL_USER=${MYSQL_USER}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD}
      - MYSQL_ROOT_HOST=${MYSQL_ROOT_HOST}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$$MYSQL_ROOT_PASSWORD || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 20
      start_period: 40s

volumes:
  mysql_data: