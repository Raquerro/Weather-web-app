services:
  frontend:
    build: ./frontend
    volumes:
    - ./frontend/src:/app/src
    ports:
      - "3000:3000"
    depends_on:
      - api
      - auth-service
    environment:
      - REACT_APP_API_URL=${REACT_APP_API_URL}
      - REACT_APP_AUTH_URL=${REACT_APP_AUTH_URL}

  api:
    build: ./backend
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    environment:
      - DATABASE_URL=mysql+pymysql://${MYSQL_USER}:${MYSQL_PASSWORD}@db:3306/appdb
      - SECRET_KEY=${SECRET_KEY}
      - ALGORITHM=${ALGORITHM}
      - INTERNAL_SERVICE_TOKEN=${INTERNAL_SERVICE_TOKEN}  
      - SMS_SERVICE_URL=http://sms-service:8002           # do sms service reczne wywolanie

  auth-service:
    build: ./auth-service
    ports:
      - "8001:8001"
    depends_on:
      db:
        condition: service_healthy
    environment:
      - DATABASE_URL=mysql+pymysql://${MYSQL_USER}:${MYSQL_PASSWORD}@db:3306/authdb
      - SECRET_KEY=${SECRET_KEY}
      - ALGORITHM=${ALGORITHM}
      - ACCESS_TOKEN_EXPIRE_MINUTES=${ACCESS_TOKEN_EXPIRE_MINUTES}
      - INTERNAL_SERVICE_TOKEN=${INTERNAL_SERVICE_TOKEN}

  db:
    image: mysql:8
    ports:
      - "3306:3306"
    environment:
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD}
      - MYSQL_USER=${MYSQL_USER}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD}
      - MYSQL_ROOT_HOST=${MYSQL_ROOT_HOST}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$$MYSQL_ROOT_PASSWORD"]
      interval: 10s
      timeout: 10s
      retries: 20
      start_period: 40s

  sms-service:
    build: ./sms-service
    ports:
      - "8002:8002"
    depends_on:
      - auth-service
    environment:
      - SMS_PROVIDER=${SMS_PROVIDER}
      - AUTH_SERVICE_URL=http://auth-service:8001
      - BACKEND_URL=http://api:8000
      - INTERNAL_SERVICE_TOKEN=${INTERNAL_SERVICE_TOKEN}
      - SMS_CHECK_INTERVAL_HOURS=${SMS_CHECK_INTERVAL_HOURS}
      - SMSAPI_TOKEN=${SMSAPI_TOKEN}       # Token do serwisu SMS
      - SMSAPI_SENDER=${SMSAPI_SENDER}     # Sender

# --- NAKŁADKA BAZY DANYCH ---
  adminer:
    image: adminer
    restart: always
    ports:
      - "8080:8080"
    depends_on:
      - db

volumes:
  mysql_data:
